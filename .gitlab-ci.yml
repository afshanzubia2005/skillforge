stages:
  - build
  - test


build-job:
  stage: build
  image: python:3.11
  script:
    - source app/api/venv/bin/activate
    - pip install -r requirements.txt
    - echo "Hello, $GITLAB_USER_LOGIN!"
    - flake8 > style_logs.txt
  after_script:
    - echo "(Gitlab) Build job finished!"

test-job1:
  stage: test
  image: python:3.11
  script:
    - source app/api/venv/bin/activate
    - pip install -r requirements.txt
    - cd ../..
    - pytest
  retry: 2
  after_script:
    - echo "(Gitlab) Test Job 1 finished!"

